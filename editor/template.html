<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#edf1ee">
<title>Редактор зала</title>
<style>
:root{color-scheme:light dark;--f:-apple-system,"SF Pro Text",Manrope,system-ui,sans-serif;
--bg:#edf1ee;--ink:#0f1a16;--mut:#56635d;--gl:rgba(255,255,255,.62);--gl2:rgba(255,255,255,.9);--glb:rgba(255,255,255,.85);--hi:rgba(255,255,255,.95);--sh:rgba(16,40,30,.2);--line:rgba(15,26,22,.12);
--em:#14825f;--emd:#0b5a42;--emhi:#3a9c7b;--emsoft:rgba(20,130,95,.14);--red:#d43a3a;--redsoft:rgba(212,58,58,.14);--amb:#c98208;
--floor:#fbfcfa;--floorS:#eef2ef;--gridc:rgba(15,26,22,.07);--gridm:rgba(15,26,22,.13);--wall:#d9cfb8;--walls:#b3a88f;--dk:#2f3633;--dk2:#58625d;--tb:#ffffff;--tbs:#bfcbc5;--chair:#dfe5e1;--chairb:#9eaba5;
--vipg:rgba(205,226,206,.9);--vipd:rgba(216,214,209,.9);--dance:rgba(236,226,204,.75);--aq:#8fc3c9;--win:#cfe6f2;--col:#a7afab;--cv1:#b4e4cf;--cv2:#f7c3cf;--cv3:#f2e1bd}
@media (prefers-color-scheme:dark){:root{--bg:#06100d;--ink:#eef3ef;--mut:#a3b5ac;--gl:rgba(30,40,36,.62);--gl2:rgba(52,64,59,.92);--glb:rgba(255,255,255,.14);--hi:rgba(255,255,255,.18);--sh:rgba(0,0,0,.6);--line:rgba(255,255,255,.12);
--em:#38bd8d;--emd:#1d8661;--emhi:#62d2a8;--emsoft:rgba(56,189,141,.18);--red:#ff6b6b;--redsoft:rgba(255,107,107,.18);--amb:#f4b84a;
--floor:#16201c;--floorS:#1d2824;--gridc:rgba(255,255,255,.05);--gridm:rgba(255,255,255,.1);--wall:#46524b;--walls:#5f6d65;--dk:#56625c;--dk2:#76837d;--tb:#26322d;--tbs:#4a5a53;--chair:#34413b;--chairb:#5d6c65;
--vipg:rgba(60,100,75,.35);--vipd:rgba(90,90,100,.3);--dance:rgba(255,255,255,.06);--aq:#2f6b72;--win:#2f5468;--col:#6d7772;--cv1:#0f5a43;--cv2:#5e1a2b;--cv3:#123a4e}}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);overscroll-behavior:none}
body{color:var(--ink);font:16px/1.4 var(--f);-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
body::before{content:"";position:fixed;inset:-10%;z-index:-1;background:radial-gradient(38% 30% at 12% 8%,var(--cv1) 0%,transparent 70%),radial-gradient(34% 28% at 92% 30%,var(--cv2) 0%,transparent 70%),radial-gradient(46% 36% at 40% 96%,var(--cv3) 0%,transparent 72%),var(--bg)}
button,input,textarea{font:inherit;color:inherit}
button{touch-action:manipulation}
input,textarea{-webkit-user-select:text;user-select:text}
.ic{flex:none;display:block}
.glass{background:var(--gl);-webkit-backdrop-filter:blur(22px) saturate(180%);backdrop-filter:blur(22px) saturate(180%);border:1px solid var(--glb);box-shadow:inset 0 1px 0 var(--hi),0 12px 32px -14px var(--sh)}
#cv{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block;cursor:grab}
#cv.grabbing{cursor:grabbing}
/* top */
#top{position:fixed;left:8px;right:8px;top:calc(env(safe-area-inset-top) + 8px);z-index:5;border-radius:24px;padding:6px;display:flex;gap:6px;align-items:center}
#halls{flex:1;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:1px}
#halls::-webkit-scrollbar{display:none}
.hchip{flex:none;border:0;border-radius:18px;padding:0 14px;min-height:42px;font-weight:650;font-size:15px;background:transparent;cursor:pointer;display:flex;align-items:center;gap:6px;white-space:nowrap}
.hchip.on{background:linear-gradient(180deg,var(--emhi),var(--emd));color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 6px 14px -8px var(--em)}
.hchip.add{color:var(--em)}
.ib{flex:none;width:42px;height:42px;border-radius:50%;border:0;background:transparent;display:grid;place-items:center;cursor:pointer;color:var(--ink)}
.ib:disabled{opacity:.3}
.ib:active,.hchip:active{transform:scale(.94)}
/* warn chip */
#warn{position:fixed;left:12px;top:calc(env(safe-area-inset-top) + 70px);z-index:4;border-radius:16px;padding:7px 12px;font-size:13.5px;font-weight:650;color:var(--red);display:none;align-items:center;gap:6px;border:0;cursor:pointer}
#warn.show{display:flex}
/* zoom */
#zoom{position:fixed;right:10px;top:calc(env(safe-area-inset-top) + 70px);z-index:4;border-radius:22px;display:flex;flex-direction:column;padding:3px}
#zoom .ib{width:40px;height:40px}
/* bottom bar */
#bar{position:fixed;left:8px;right:8px;bottom:calc(env(safe-area-inset-bottom) + 8px);z-index:5;border-radius:26px;padding:6px;display:flex;gap:4px;align-items:stretch}
.bb{flex:1 1 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border:0;background:transparent;border-radius:20px;min-height:58px;padding:6px 2px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11.5px;font-weight:650;color:var(--ink);cursor:pointer;line-height:1.1}
.bb .ic{color:var(--em)}.bb.warn .ic,.bb.warn{color:var(--red)}
.bb.on{background:var(--emsoft)}
.bb:active{transform:scale(.95)}
.bb.pri{flex:2.2;flex-direction:row;gap:8px;font-size:16px;color:#fff;background:linear-gradient(180deg,var(--emhi),var(--emd));box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 10px 22px -10px var(--em)}
.bb.pri .ic{color:#fff}
.bnote{flex:1;display:flex;align-items:center;padding:0 10px;font-size:14px;font-weight:600;line-height:1.25}
.bscroll{flex:1;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;-webkit-mask:linear-gradient(90deg,#000 88%,transparent);mask:linear-gradient(90deg,#000 88%,transparent)}
.bscroll::-webkit-scrollbar{display:none}
.bscroll .bb{flex:0 0 62px}
.bb.fix{flex:0 0 74px}
/* joystick */
#nudge{position:fixed;left:8px;right:8px;margin:0 auto;max-width:400px;bottom:calc(env(safe-area-inset-bottom) + 86px);z-index:4;border-radius:28px;padding:10px;display:none;gap:12px;align-items:center}
#nudge.show{display:flex}
.joy{position:relative;flex:none;width:136px;height:136px;border-radius:50%;background:radial-gradient(circle,var(--emsoft) 0 30%,transparent 31%),var(--gl);border:1px solid var(--glb);box-shadow:inset 0 2px 10px -4px var(--sh);touch-action:none;cursor:grab}
.joy::before{content:"";position:absolute;inset:10px;border-radius:50%;border:1.5px dashed var(--line)}
.joy i{position:absolute;color:var(--mut);opacity:.7;pointer-events:none}
.joy .knob{position:absolute;left:50%;top:50%;width:58px;height:58px;margin:-29px 0 0 -29px;border-radius:50%;background:linear-gradient(180deg,var(--emhi),var(--emd));box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 8px 18px -6px var(--em);pointer-events:none;display:grid;place-items:center;color:#fff}
.joy.on .knob{transition:none}.joy:not(.on) .knob{transition:transform .18s cubic-bezier(.2,.8,.2,1)}
.jside{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:6px}
.jside button{border:1px solid var(--glb);background:var(--gl);border-radius:16px;min-height:44px;font-weight:700;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:4px;box-shadow:inset 0 1px 0 var(--hi);color:var(--ink)}
.jside button:active{background:var(--emsoft)}
.jside .wide{grid-column:1/3;color:var(--mut);font-weight:650}
.jside .jh{grid-column:1/3;font-size:12.5px;color:var(--mut);text-align:center;line-height:1.25}
/* sheet */
#shade{position:fixed;inset:0;z-index:9;background:rgba(0,0,0,.18);display:none}
#shade.show{display:block}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:10;max-height:78vh;overflow-y:auto;overscroll-behavior:contain;border-radius:28px 28px 0 0;padding:8px 16px calc(env(safe-area-inset-bottom) + 18px);display:none;background:var(--gl2);-webkit-backdrop-filter:blur(26px) saturate(180%);backdrop-filter:blur(26px) saturate(180%);border-top:1px solid var(--glb);box-shadow:0 -12px 40px -10px var(--sh);-webkit-user-select:none;user-select:none;max-width:620px;margin:0 auto}
#sheet.show{display:block;animation:up .26s cubic-bezier(.2,.8,.2,1)}
#sheet.half{max-height:52vh}
@keyframes up{from{transform:translateY(40px);opacity:.5}}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:2px auto 8px}
.sh-h{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.sh-h b{flex:1;font-size:19px}
.lab{font-size:12.5px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.04em;margin:14px 2px 6px}
.row{display:flex;align-items:center;gap:10px;min-height:52px;border-bottom:1px solid var(--line)}
.row>span{flex:1;font-weight:600}
.row:last-child{border-bottom:0}
.card{background:var(--gl);border:1px solid var(--glb);border-radius:20px;padding:2px 14px;box-shadow:inset 0 1px 0 var(--hi)}
.tin{border:1px solid var(--line);background:var(--gl);border-radius:14px;padding:9px 12px;min-height:44px;width:160px;font-size:16px;text-align:right}
textarea.tin{width:100%;text-align:left;min-height:70px;resize:vertical;margin:8px 0}
.stp{display:flex;align-items:center;gap:4px}
.stp button{width:44px;height:44px;border-radius:50%;border:1px solid var(--glb);background:var(--gl);font-size:22px;font-weight:600;cursor:pointer;display:grid;place-items:center;box-shadow:inset 0 1px 0 var(--hi)}
.stp input{width:62px;text-align:center;border:0;background:transparent;font-weight:750;font-size:17px;-moz-appearance:textfield}
.stp input::-webkit-inner-spin-button{display:none}
.seg{display:flex;background:var(--line);border-radius:14px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;border-radius:11px;padding:8px 12px;font-weight:650;font-size:14px;cursor:pointer;min-height:38px}
.seg button.on{background:var(--gl2);color:var(--em);box-shadow:0 2px 8px -3px var(--sh)}
.pal{display:flex;flex-wrap:wrap;gap:10px;padding:10px 0}
.sw{width:40px;height:40px;border-radius:50%;border:2px solid var(--glb);cursor:pointer;box-shadow:0 3px 8px -4px var(--sh)}
.sw.on{outline:3px solid var(--em);outline-offset:2px}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 4px}
.btn{flex:1 1 auto;border:1px solid var(--glb);background:var(--gl);border-radius:18px;min-height:48px;padding:8px 14px;font-weight:650;font-size:15px;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;box-shadow:inset 0 1px 0 var(--hi)}
.btn .ic{color:var(--em)}
.btn.pri{color:#fff;border-color:transparent;background:linear-gradient(180deg,var(--emhi),var(--emd))}
.btn.pri .ic{color:#fff}
.btn.danger{color:var(--red)}.btn.danger .ic{color:var(--red)}
.btn.sm{flex:0 0 auto;min-height:40px;padding:6px 12px;font-size:14px}
.rng{display:flex;align-items:center;gap:10px;width:100%;padding:8px 0}
.rng input{flex:1;accent-color:var(--em);height:32px}
.rng b{min-width:52px;text-align:right}
.hint{font-size:13.5px;color:var(--mut);margin:6px 2px}
.err{color:var(--red);font-size:13.5px;font-weight:600;margin:4px 2px}
.jchips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 0}
.jc{border-radius:12px;background:var(--emsoft);color:var(--em);padding:6px 10px;font-weight:700;font-size:14px}
/* library */
.cats{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:2px 16px 8px}
.cats::-webkit-scrollbar{display:none}
.cat{flex:none;border:1px solid var(--glb);background:var(--gl);border-radius:16px;padding:8px 14px;font-weight:650;font-size:14.5px;cursor:pointer;min-height:42px}
.cat.on{background:linear-gradient(180deg,var(--emhi),var(--emd));color:#fff;border-color:transparent}
.lib{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px}
.tile{border:1px solid var(--glb);background:var(--gl);border-radius:20px;padding:10px 6px 8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:13px;font-weight:650;text-align:center;line-height:1.2;box-shadow:inset 0 1px 0 var(--hi)}
.tile:active{transform:scale(.95)}
.tile svg{width:84px;height:62px}
.tile small{color:var(--mut);font-weight:600;font-size:11.5px}
/* menu */
.mi{display:flex;align-items:center;gap:12px;width:100%;border:0;background:transparent;min-height:54px;font-weight:600;font-size:16px;cursor:pointer;text-align:left;border-bottom:1px solid var(--line);padding:0 2px}
.mi:last-child{border-bottom:0}
.mi .ic{color:var(--em)}.mi span{flex:1}
.mi.danger,.mi.danger .ic{color:var(--red)}
.tg{width:50px;height:30px;border-radius:15px;background:var(--line);position:relative;flex:none;transition:background .2s}
.tg::after{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.25);transition:transform .2s}
.tg.on{background:var(--em)}.tg.on::after{transform:translateX(20px)}
textarea.code{width:100%;min-height:120px;font:12px/1.35 ui-monospace,Menlo,monospace;border-radius:14px;border:1px solid var(--line);background:var(--gl);padding:10px;margin-top:8px}
/* toast */
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 92px);transform:translateX(-50%);z-index:20;border-radius:18px;padding:10px 10px 10px 16px;font-weight:600;font-size:14.5px;display:none;align-items:center;gap:10px;max-width:calc(100vw - 24px);background:var(--gl2)}
#toast.show{display:flex}
#toast button{border:0;background:var(--emsoft);color:var(--em);font-weight:700;border-radius:12px;padding:8px 12px;cursor:pointer}
/* help card */
#help{position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom) + 92px);z-index:6;border-radius:22px;padding:14px 16px;display:none;max-width:520px;margin:0 auto}
#help.show{display:block}
#help ul{margin:6px 0 10px;padding-left:20px;font-size:14.5px}
#help li{margin:4px 0}
/* svg */
.floor{fill:var(--floor);stroke:var(--line);stroke-width:1.5}
.obj .hit{fill:transparent}
.tb{fill:var(--tb);stroke:var(--tbs);stroke-width:1.4}
.chs{fill:var(--chair)}.chb{fill:var(--chairb)}
.tn{fill:var(--ink);font-weight:800}.ts{fill:var(--mut);font-weight:650}
.obj.bad .tb{stroke:var(--red);stroke-width:3}
.obj.jt .tb{stroke:var(--em);stroke-width:3.5}
.obj.jn .tb{fill:var(--emsoft);stroke:var(--em);stroke-width:2.5}
.dl{font-weight:700;fill:var(--mut)}.dlw{font-weight:700;fill:rgba(255,255,255,.88)}
.ovl{fill:none;stroke:var(--em);stroke-width:1.6;stroke-dasharray:6 4}
.ovm{fill:none;stroke:var(--em);stroke-width:1.2}
.hd{fill:#fff;stroke:var(--em);stroke-width:2}
.hdh{fill:transparent;cursor:pointer}
.stem{stroke:var(--em);stroke-width:1.6}
.knob{fill:var(--gl2);stroke:var(--em);stroke-width:2}
.gd{stroke:var(--amb);stroke-width:1.2;stroke-dasharray:4 3}
.badge rect{fill:var(--dk)}.badge text{fill:#fff;font:700 12px var(--f)}
.jl{stroke:var(--em);stroke-width:2;stroke-dasharray:3 4;opacity:.8}
.lkb circle{fill:var(--amb)}
@media (prefers-reduced-motion:reduce){#sheet.show{animation:none}}
</style></head>
<body>
<svg id="cv" aria-label="Схема зала"><defs>

<div id="toast" class="glass" role="status"></div>
<script>

function chairsAround(t,type){const a0=(t.rot||0)*RAD,c=Math.cos(a0),sn=Math.sin(a0),z=t.zone,out=[];
 const n=t.seats|0;if(n<=0)return out;const pos=[];
 if(t.shape==='round'){const r=t.w/2+8.5;for(let i=0;i<n;i++){const a=(n===2?(t.sa==='v'?-Math.PI/2:0):-Math.PI/2)+i*2*Math.PI/n;pos.push([r*Math.cos(a),r*Math.sin(a),a/RAD+90])}}
 else{const A=Math.ceil(n/2),B=n-A,hz=t.w>=t.h,L=hz?t.w:t.h,E=(hz?t.h:t.w)/2+8.5;
  for(let i=0;i<A;i++){const p=-L/2+L*(i+.5)/A;pos.push(hz?[p,-E,0]:[-E,p,-90])}
  for(let i=0;i<B;i++){const p=-L/2+L*(i+.5)/B;pos.push(hz?[p,E,180]:[E,p,90])}}
 for(const[x,y,a]of pos)out.push({id:uid('d'),z,t:type||'chair',x:f1(t.x+x*c-y*sn),y:f1(t.y+x*sn+y*c),w:13,h:12,rot:nA(a+(t.rot||0)),label:''});
 return out}

function boxOf(o,k){if(k==='d'&&o.t==='text'){const fs=o.fs||12;return[Math.max(20,(o.label||'').length*fs*.58+10),fs*1.5]}
 if(k==='t'&&o.shape==='round')return[o.w,o.w];return[o.w,o.h]}
function corners(o,k,pad=0){const[w,h]=boxOf(o,k),a=(o.rot||0)*RAD,c=Math.cos(a),s=Math.sin(a),hw=w/2+pad,hh=h/2+pad;

function sat(A,B){for(const P of[A,B])for(let i=0;i<P.length;i++){const p=P[i],q=P[(i+1)%P.length],nx=q[1]-p[1],ny=p[0]-q[0];let a1=1e9,a2=-1e9,b1=1e9,b2=-1e9;for(const v of A){const d=v[0]*nx+v[1]*ny;a1=Math.min(a1,d);a2=Math.max(a2,d)}for(const v of B){const d=v[0]*nx+v[1]*ny;b1=Math.min(b1,d);b2=Math.max(b2,d)}const L=Math.hypot(nx,ny)||1;if(a2<=b1+.8*L||b2<=a1+.8*L)return false}return true}
const OBST=new Set(['wall','column','bar','dark','host','aqua','stairs']);
function overlaps(){const bad=new Set(),T=S.tables.filter(t=>t.zone===ui.zone),D=S.decor.filter(d=>d.z===ui.zone&&OBST.has(d.t));
 const P=new Map(T.map(t=>[t,polyOf(t,'t')]));
 for(let i=0;i<T.length;i++){for(let j=i+1;j<T.length;j++)if(sat(P.get(T[i]),P.get(T[j]))){bad.add(T[i].id);bad.add(T[j].id)}
  for(const d of D)if(sat(P.get(T[i]),polyOf(d,'d')))bad.add(T[i].id)}
 return bad}

/* nudge pad with hold-to-repeat */
let nT=0,nI=0,nPre=null;
$('#nudge').addEventListener('pointerdown',e=>{const b=e.target.closest('[data-n]');if(!b)return;e.preventDefault();nPre=dataStr();const v=b.dataset.n;
 const run=()=>{if(v[0]==='r'){nudge(0,0,v==='r-'?-1:v==='r+'?1:+v.slice(1))}else{const[x,y]=v.split(',').map(Number);nudge(x,y)}};run();
 nT=setTimeout(()=>{nI=setInterval(run,70)},380)});
const nEnd=()=>{clearTimeout(nT);clearInterval(nI);if(nPre&&nPre!==dataStr()){pushUndo(nPre);renderTop()}nPre=null};
['pointerup','pointercancel'].forEach(ev=>$('#nudge').addEventListener(ev,nEnd));
$('#nudge').addEventListener('pointerleave',e=>{if(!J)nEnd()});
/* joystick */
let J=null;const JR=46;
$('#nudge').addEventListener('pointerdown',e=>{const jy=e.target.closest('#joy');if(!jy)return;e.preventDefault();
 const so=selObjs().filter(x=>!x.o.lock);if(!so.length){toast('Объект закреплён. Снимите замок, чтобы двигать');return}
 try{jy.setPointerCapture(e.pointerId)}catch(_){}
 const r=jy.getBoundingClientRect();J={id:e.pointerId,el:jy,cx:r.left+r.width/2,cy:r.top+r.height/2,vx:0,vy:0,t:performance.now(),pre:dataStr(),items:so.map(x=>x.o)};
 jy.classList.add('on');joyMove(e);J.raf=requestAnimationFrame(joyTick)});
function joyMove(e){if(!J||e.pointerId!==J.id)return;let dx=e.clientX-J.cx,dy=e.clientY-J.cy;const d=Math.hypot(dx,dy);if(d>JR){dx*=JR/d;dy*=JR/d}
 J.vx=dx/JR;J.vy=dy/JR;J.el.querySelector('.knob').style.transform=`translate(${dx}px,${dy}px)`}
function joyTick(now){if(!J)return;const dt=Math.min(.05,(now-J.t)/1000);J.t=now;
 const m=Math.hypot(J.vx,J.vy);
 if(m>.08){const sp=(.12+.88*Math.pow((m-.08)/.92,2))*170,ux=J.vx/m,uy=J.vy/m,k=ui.cam.k,z=zone();
  for(const o of J.items){o.x=f1(clamp(o.x+ux*sp*dt/k,0,W));o.y=f1(clamp(o.y+uy*sp*dt/k,0,z.h))}
  const o=J.items[0],[sx,sy]=toS(o.x,o.y),top=$('#top').getBoundingClientRect().bottom+30,bot=$('#nudge').getBoundingClientRect().top-30;let px=0,py=0;
  if(sx<40)px=40-sx;else if(sx>innerWidth-40)px=innerWidth-40-sx;if(sy<top)py=top-sy;else if(sy>bot)py=bot-sy;
  if(px||py){ui.cam.tx+=clamp(px,-sp*dt*1.2,sp*dt*1.2);ui.cam.ty+=clamp(py,-sp*dt*1.2,sp*dt*1.2);world.setAttribute('transform',`translate(${f1(ui.cam.tx)},${f1(ui.cam.ty)}) scale(${ui.cam.k.toFixed(4)})`)}
  rafWorld()}
 J.raf=requestAnimationFrame(joyTick)}
function joyEnd(e){if(!J||e.pointerId!==J.id)return;cancelAnimationFrame(J.raf);J.el.classList.remove('on');J.el.querySelector('.knob').style.transform='';
 const pre=J.pre;J=null;if(pre!==dataStr()){pushUndo(pre);renderTop();renderWorld();renderOv();save()}}
$('#nudge').addEventListener('pointermove',joyMove);
['pointerup','pointercancel','lostpointercapture'].forEach(ev=>$('#nudge').addEventListener(ev,joyEnd));
document.addEventListener('keydown',e=>{if(/INPUT|TEXTAREA/.test(document.activeElement?.tagName))return;
 const k=e.key;if((e.metaKey||e.ctrlKey)&&k.toLowerCase()==='z'){e.preventDefault();e.shiftKey?redo():undo();return}
 if(k==='Escape'){if(ui.sheet)closeSheet();else{ui.sel=[];ui.join=null;render()}return}
 if(!ui.sel.length)return;if(k==='Delete'||k==='Backspace'){e.preventDefault();delSel();return}
 const m={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0]}[k];if(m){e.preventDefault();snap();nudge(m[0],m[1]);renderTop()}});
mq.addEventListener?.('change',()=>render());
addEventListener('resize',()=>{renderOv()});
$('#sheet').addEventListener('pointerdown',e=>e.stopPropagation());

/* ---------- boot ---------- */
renderZoom();render();requestAnimationFrame(fit);
if(!S.pref.hint)setTimeout(()=>showHelp(true),350);
</script>
</body></html>
