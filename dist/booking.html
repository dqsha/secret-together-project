 background:linear-gradient(180deg,var(--emhi),var(--emd));box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 10px 24px -10px var(--em)}

 if(mode==='edit'){c='ed';sub=t.seats+' м';const s=ui.esel?.k==='t'&&tab(ui.esel.id);
  if(s&&s.id!==t.id&&s.join.includes(t.id))c+=' hl';
  if(s&&s.id===t.id)extra=`<rect class="selbox" x="${-t.w/2-14}" y="${-t.h/2-14}" width="${t.w+28}" height="${t.h+28}" rx="14"/>`}
 else if(mode==='admin'){const st=tableAt(t,ui.adate,ui.T);
  if(st.b){c={new:'an',wait:'aw',open:'ac'}[st.b.status];sub=st.b.table===t.id?st.b.name.split(/[ ,]/)[0].slice(0,7):'к '+(tab(st.b.table)?.n||'')}else{c='fr';sub=t.seats+' м'}}
 else{const p=plan(t,ui.date,gS(),gE(),ui.g);
  if(ui.sel===t.id){c='sel';sub=ui.g+' гост.'}
  else if(ui.selJ.includes(t.id)){c='jn';sub='к '+tab(ui.sel).n}
  else{c=p.st;sub=p.st==='ok'?t.seats+' м':p.st==='mg'?`${t.seats}→${ui.g}`:p.st==='sm'?'до '+p.max:'занят'}}
 const body=t.shape==='round'?`<circle class="b" r="${t.w/2}"/>`:`<rect class="b" x="${-t.w/2}" y="${-t.h/2}" width="${t.w}" height="${t.h}" rx="${Math.min(10,t.w/3,t.h/3)}"/>`;
 const act=mode==='edit'?`data-k="t"`:`data-act="table" tabindex="0" role="button"`;
 return `<g class="tbl ${c} ${mode==='edit'?'drag':''}" data-id="${esc(t.id)}" ${act} transform="translate(${t.x},${t.y})" aria-label="Стол ${esc(t.n)}, ${t.seats} мест">${extra}${seatDots(t)}${body}<text class="n" y="-5" text-anchor="middle" dominant-baseline="middle" font-size="14" font-weight="800">${esc(t.n)}</text><text class="n" y="10" text-anchor="middle" dominant-baseline="middle" font-size="10.5" font-weight="600">${esc(sub)}</text></g>`;
}

/* ---------- smooth DOM update (без мерцания) ---------- */
function morph(a,b){
 if(a.nodeType!==b.nodeType||a.nodeName!==b.nodeName){a.replaceWith(b);return}
 if(a.nodeType!==1){if(a.nodeValue!==b.nodeValue)a.nodeValue=b.nodeValue;return}
 for(const at of [...a.attributes])if(!b.hasAttribute(at.name))a.removeAttribute(at.name);
 for(const at of [...b.attributes])if(a.getAttribute(at.name)!==at.value)a.setAttribute(at.name,at.value);
 morphChildren(a,b);
 const tag=a.nodeName;if((tag==='INPUT'||tag==='TEXTAREA')&&a!==document.activeElement&&a.type!=='file'&&a.value!==b.value)a.value=b.value;
 if(tag==='SELECT'){const o=b.querySelector('option[selected]');if(o&&a.value!==o.value)a.value=o.value}
}
function morphChildren(a,b){
 const keyed=new Map();for(const c of a.children){const k=c.getAttribute('data-id');if(k)keyed.set(k,c)}
 const bc=[...b.childNodes];let i=0;
 for(const nb of bc){const cur=a.childNodes[i],k=nb.nodeType===1&&nb.getAttribute('data-id');
  if(k&&keyed.has(k)){const old=keyed.get(k);keyed.delete(k);if(old!==cur)a.insertBefore(old,cur||null);morph(old,nb)}
  else if(cur){const ck=cur.nodeType===1&&cur.getAttribute('data-id');if(ck)keyed.delete(ck);morph(cur,nb)}
  else a.appendChild(nb);
  i++}
 while(a.childNodes.length>i)a.lastChild.remove();
}
function morphInto(el,html){const t=document.createElement('template');t.innerHTML=html;morphChildren(el,t.content)}

  case 'rot':if(!it)return;snap();if(!isT&&it.t==='text')it.rot=it.rot?0:-90;else{[it.w,it.h]=[it.h,it.w];if(isT&&it.sa)it.sa=it.sa==='v'?'h':'v'}commit();break;
  case 'dup':{if(!it)return;snap();const c=JSON.parse(JSON.stringify(it));c.x=clamp(c.x+20,0,360);c.y+=20;
   if(isT){c.id=uid('t');c.n=nextNum();c.join=[];S.tables.push(c);ui.esel={k:'t',id:c.id}}else{c.id=uid('d');S.decor.push(c);ui.esel={k:'d',id:c.id}}commit();break}
  case 'back':if(!it||isT)return;snap();S.decor=[it,...S.decor.filter(d=>d!==it)];commit();break;
  case 'del':if(!it)return;if(!twice(el,'Ещё раз'))return;snap();
   if(isT){S.tables=S.tables.filter(t=>t!==it);S.tables.forEach(t=>t.join=t.join.filter(x=>x!==it.id))}else S.decor=S.decor.filter(d=>d!==it);
   ui.esel=null;commit();toast('Удалено');break;
  case 'p-join':{if(!it)return;snap();const o=tab(id),on=it.join.includes(id);
   it.join=on?it.join.filter(x=>x!==id):[...it.join,id];o.join=on?o.join.filter(x=>x!==it.id):[...new Set([...o.join,it.id])];commit();break}
  case 'z-add':{snap();const z={id:uid('z'),name:'Новая зона',h:400};S.zones.push(z);ui.zone=z.id;ui.esel=null;commit();toast('Зона добавлена — переименуйте её ниже');break}
  case 'z-h':{const z=zone(ui.zone);snap();z.h=clamp(z.h+(+v),200,2000);commit();break}
  case 'z-del':{if(S.zones.length<2)return toast('Нужна хотя бы одна зона');if(!twice(el,'Удалить со всеми столами?'))return;snap();
   const zid=ui.zone,gone=S.tables.filter(t=>t.zone===zid).map(t=>t.id);S.zones=S.zones.filter(z=>z.id!==zid);S.tables=S.tables.filter(t=>t.zone!==zid);
   S.tables.forEach(t=>t.join=t.join.filter(x=>!gone.includes(x)));S.decor=S.decor.filter(d=>d.z!==zid);ui.zone=S.zones[0].id;ui.esel=null;commit();break}
  case 'copy-json':{const j=planJSON();ui.json='out';render();const ta=$('#j-out');if(ta){ta.focus();ta.select()}
   if(navigator.clipboard)navigator.clipboard.writeText(j).then(()=>toast('Схема скопирована'),()=>toast('Выделите текст ниже и скопируйте вручную'));else toast('Выделите текст ниже и скопируйте вручную');break}
  case 'show-in':ui.json=ui.json==='in'?'':'in';render();break;
  case 'load-json':{try{const o=JSON.parse($('#j-in').value);
    if(!Array.isArray(o.zones)||!o.zones.length||!Array.isArray(o.tables)||!Array.isArray(o.decor))throw 0;
    snap();S.zones=o.zones;S.tables=o.tables.map(t=>({join:[],...t}));S.decor=o.decor;ui.zone=S.zones[0].id;ui.esel=null;ui.json='';commit();toast('Схема загружена')}
   catch(err){toast('Не получилось прочитать схему — скопирован ли весь текст?')}break}
  case 'reset-plan':if(!twice(el,'Нажмите ещё раз'))return;snap();S.zones=cp(PLAN.zones);S.tables=cp(PLAN.tables);S.decor=cp(PLAN.decor);ui.zone=S.zones[0].id;ui.esel=null;commit();toast('Схема сброшена');break;
  case 'save-set':{const pin=$('#s-pin').value.trim(),o=$('#s-open').value,c=$('#s-close').value;
   if(pin.length<4){ui.err='PIN — минимум 4 цифры';return render()}
   if(!o||!c||o===c){ui.err='Проверьте часы работы';return render()}
   Object.assign(S.set,{name:$('#s-name').value.trim()||'Ресторан',addr:$('#s-addr').value.trim(),open:o,close:c,dur:+$('#s-dur').value,pin});ui.err='';save();pickTime();pickT();render();toast('Сохранено');break}
  case 'reset-all':if(!twice(el,'Нажмите ещё раз — всё сбросится'))return;S=fresh();undo=[];save();ui.atab='tables';ui.zone=S.zones[0].id;pickT();render();toast('Сброшено');break;
  case 'close':closeSheet();break;
  case 'close-bg':if(e.target===el)closeSheet();break;
 }
});
document.addEventListener('change',e=>{
 const id=e.target.id;
 if(id==='p-label'){const it=curItem();if(!it)return;const v=e.target.value.trim();snap();if(ui.esel.k==='t'){if(v)it.n=v}else it.label=v;commit()}
 if(id==='z-name'){const z=zone(ui.zone),v=e.target.value.trim();if(v){snap();z.name=v;commit()}}
 if(id==='nb-time'){ui.nb.time=e.target.value;if(ui.nb.dur&&toAbs(ui.nb.time)+ui.nb.dur>C())ui.nb.dur=0;nbSheet()}
 if(id==='p-photo'){const f=e.target.files[0],t=tab(e.target.dataset.id);if(!f||!t)return;resizeImg(f,url=>{const k=uid('ph');const old=t.photo;S.photos[k]=url;t.photo=k;if(!save()){delete S.photos[k];t.photo=old;return}if(old&&S.photos[old])delete S.photos[old];save();propsSheet(t);render();toast('Фото сохранено')})}
});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches?.('.tbl[data-act]')){e.preventDefault();e.target.dispatchEvent(new MouseEvent('click',{bubbles:true}))}
 if(e.key==='Enter'&&e.target.id==='pin')$('[data-act="pin"]').click();
 if(e.key==='Enter'&&e.target.id==='p-label')e.target.blur()});
document.addEventListener('input',e=>{
 if(e.target.classList?.contains('phone')){const el=e.target,f=fmtPhone(el.value);if(el.value!==f){el.value=f;try{el.setSelectionRange(f.length,f.length)}catch(_){}}}
 const k={'f-name':'name','f-phone':'phone','f-comment':'comment'}[e.target.id];if(k)ui.form[k]=e.target.value;
 const nk={'nb-name':'name','nb-phone':'phone','nb-comment':'comment'}[e.target.id];if(nk&&ui.nb)ui.nb[nk]=e.target.value;
 if(e.target.id==='trange'){ui.T=+e.target.value;$('#tval').textContent='с '+hm(ui.T);morphInto($('#tlist'),tablesBody())}
 if(e.target.id==='q'){ui.q=e.target.value;const L=document.createElement('div');L.innerHTML=hostList();morphInto($('#blist'),L.querySelector('#blist').innerHTML)}
});
document.addEventListener('focusin',e=>{if(e.target.classList?.contains('phone')){const el=e.target;if(!el.value)el.value='+7 ';setTimeout(()=>{try{el.setSelectionRange(el.value.length,el.value.length)}catch(_){}},0)}});
document.addEventListener('keydown',e=>{const el=e.target;if(el.classList?.contains('phone')&&e.key==='Backspace'&&el.value.replace(/\D/g,'').length<=1){e.preventDefault()}});
window.addEventListener('hashchange',()=>{const md=['#admin','#host','#editor'].includes(location.hash)?'admin':'guest';if(md!==ui.mode){ui.mode=md;render()}});

let drag=null,bgTap=null;
function bindDrag(){
 if(!(ui.mode==='admin'&&ui.authed&&ui.atab==='edit'))return;
 const svg=$('#mapsvg');if(!svg||svg._bound)return;svg._bound=true;const EDIT=()=>ui.mode==='admin'&&ui.atab==='edit';
 const pt=e=>{const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform(svg.getScreenCTM().inverse())};
 svg.addEventListener('touchstart',e=>{if(EDIT()&&e.target.closest('.drag'))e.preventDefault()},{passive:false});
 svg.addEventListener('pointerdown',e=>{
  if(!EDIT())return;const g=e.target.closest('.drag');
  if(!g){bgTap={x:e.clientX,y:e.clientY};return}
  const k=g.dataset.k,item=k==='t'?tab(g.dataset.id):S.decor.find(d=>d.id===g.dataset.id);if(!item)return;
  const p=pt(e);drag={k,item,g,dx:p.x-item.x,dy:p.y-item.y,sx:p.x,sy:p.y,moved:false};
  try{svg.setPointerCapture(e.pointerId)}catch(_){}e.preventDefault()});
 svg.addEventListener('pointermove',e=>{if(!drag)return;const p=pt(e);
  if(!drag.moved){if(Math.hypot(p.x-drag.sx,p.y-drag.sy)<4)return;drag.moved=true;snap()}
  const z=zone(ui.zone),r5=v=>Math.round(v/5)*5;drag.item.x=clamp(r5(p.x-drag.dx),0,360);drag.item.y=clamp(r5(p.y-drag.dy),0,z.h);
  drag.g.setAttribute('transform',`translate(${drag.item.x},${drag.item.y})`)});
 svg.addEventListener('pointerup',e=>{
  if(drag){const d=drag;drag=null;ui.esel={k:d.k,id:d.item.id};if(d.moved)save();render();return}
  if(bgTap&&Math.hypot(e.clientX-bgTap.x,e.clientY-bgTap.y)<6&&ui.esel){ui.esel=null;render()}bgTap=null});
 svg.addEventListener('pointercancel',()=>{if(drag?.moved)save();drag=null;bgTap=null});
}
render();
}
</script>
