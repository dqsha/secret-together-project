<body>
<header class="top"><div class="in glass"><div class="brand"><b id="rname">Ресторан</b><span id="raddr">бронирование столов</span></div>
<div class="seg"><button data-act="mode" data-v="guest" id="m-guest">Гость</button><button data-act="mode" data-v="admin" id="m-admin">Хостес</button></div></div></header>
<main class="wrap" id="app"></main>
<div id="fixed"></div>
<div id="sheet"></div>
<script>
{
const $=s=>document.querySelector(s);
const app=$('#app'),sheetBox=$('#sheet'),fixedBox=$('#fixed');
const KEY='rest-booking-v4';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pd=n=>String(n).padStart(2,'0');
const ds=d=>`${d.getFullYear()}-${pd(d.getMonth()+1)}-${pd(d.getDate())}`;
const pdate=s=>{const[y,mo,d]=s.split('-').map(Number);return new Date(y,mo-1,d,12)};
const WD=['воскресенье','понедельник','вторник','среда','четверг','пятница','суббота'],WDS=['Вс','Пн','Вт','Ср','Чт','Пт','Сб'];
const MON=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'],MS=['янв','фев','мар','апр','мая','июн','июл','авг','сен','окт','ноя','дек'];
const human=s=>{const d=pdate(s);return `${WD[d.getDay()]}, ${d.getDate()} ${MON[d.getMonth()]}`};
const short=s=>{const d=pdate(s);return `${d.getDate()} ${MON[d.getMonth()]}`};
const m=s=>{const[h,x]=s.split(':').map(Number);return h*60+x};
const hm=x=>`${pd(Math.floor(((x%1440)+1440)%1440/60))}:${pd(((x%60)+60)%60)}`;
const plural=(n,a,b,c)=>{const k=n%10,h=n%100;return k===1&&h!==11?a:k>=2&&k<=4&&(h<10||h>=20)?b:c};
const gw=n=>`${n} ${plural(n,'гость','гостя','гостей')}`;
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const durTxt=d=>d?(d%60?`${Math.floor(d/60)} ч ${d%60} мин`:`${d/60} ч`):'до закрытия';
const ST={new:'Новая',wait:'Ожидаем',open:'Сели',closed:'Ушли',cancelled:'Отменена'};
const SRC={online:'Забронировано гостем онлайн',host:'Добавлено хостес',walkin:'Гости без брони'};
const ACT=b=>['new','wait','open'].includes(b.status);

/* ---------- icons ---------- */
const ICONS={
 table:'<path d="M4.5 10h15"/><path d="M7 10v8.5M17 10v8.5"/><path d="M5.5 6.8c0-.9.7-1.6 1.6-1.6h9.8c.9 0 1.6.7 1.6 1.6V10h-13z"/>',

 search:'<circle cx="11" cy="11" r="6.5"/><path d="m16 16 3.8 3.8"/>',
 phone:'<path d="M7 4.2h2.6l1.5 3.9-1.9 1.3a10 10 0 0 0 5.4 5.4l1.3-1.9 3.9 1.5V17a2.3 2.3 0 0 1-2.4 2.3A14.6 14.6 0 0 1 4.7 6.6 2.3 2.3 0 0 1 7 4.2z"/>',
 chat:'<path d="M5.2 18.3 4.3 21l3-1a8.3 8.3 0 1 0-2.1-1.7z"/>',
 clock:'<circle cx="12" cy="12" r="8.4"/><path d="M12 7.8V12l2.8 1.8"/>',
 users:'<circle cx="9" cy="8.6" r="3.1"/><path d="M3.8 19c.6-2.9 2.7-4.6 5.2-4.6s4.6 1.7 5.2 4.6"/><path d="M15.6 5.8a2.9 2.9 0 0 1 0 5.6M17.6 14.7c1.5.6 2.5 2.1 2.8 4.3"/>',
 plus:'<path d="M12 5.5v13M5.5 12h13"/>',
 swap:'<path d="M6.5 8h12l-3.2-3.2M17.5 16h-12l3.2 3.2"/>',
 check:'<path d="m5.5 12.6 4.2 4.2 8.8-9.3"/>',
 x:'<path d="M7 7l10 10M17 7 7 17"/>',
 camera:'<path d="M4.2 8.7a2.5 2.5 0 0 1 2.5-2.5h1.7l1.4-2h4.4l1.4 2h1.7a2.5 2.5 0 0 1 2.5 2.5v7.8a2.5 2.5 0 0 1-2.5 2.5H6.7a2.5 2.5 0 0 1-2.5-2.5z"/><circle cx="12" cy="12.4" r="3.2"/>',
 sofa:'<path d="M5.5 11V8.7a2.5 2.5 0 0 1 2.5-2.5h8a2.5 2.5 0 0 1 2.5 2.5V11"/><path d="M3.8 13.2a1.9 1.9 0 0 1 3.8 0v1h8.8v-1a1.9 1.9 0 0 1 3.8 0v4.4H3.8z"/><path d="M6.3 17.6v1.6M17.7 17.6v1.6"/>',
 enter:'<path d="M14 4.5h3.3a2.5 2.5 0 0 1 2.5 2.5v10a2.5 2.5 0 0 1-2.5 2.5H14"/><path d="M4.2 12h10.5M11 8.3l3.7 3.7-3.7 3.7"/>',
 cal:'<rect x="4" y="5.5" width="16" height="14.5" rx="4"/><path d="M4 10.2h16M8.5 3.6v3.8M15.5 3.6v3.8"/>',
 undo:'<path d="M9 14 4.8 9.8 9 5.6"/><path d="M5 9.8h9a5.2 5.2 0 0 1 0 10.4h-2.5"/>',

 rotate:'<path d="M19 12a7 7 0 1 1-2.2-5.1"/><path d="M19.3 4.3v4h-4"/>',

 back:'<path d="m14.5 6-6 6 6 6"/>',chev:'<path d="m9.5 6 6 6-6 6"/>',
 map:'<path d="M9 5.2 4.5 7v12l4.5-1.8 6 2 4.5-1.8v-12L15 7.2z"/><path d="M9 5.2v12M15 7.2v12"/>',
 grid:'<rect x="4.2" y="4.2" width="6.8" height="6.8" rx="2.3"/><rect x="13" y="4.2" width="6.8" height="6.8" rx="2.3"/><rect x="4.2" y="13" width="6.8" height="6.8" rx="2.3"/><rect x="13" y="13" width="6.8" height="6.8" rx="2.3"/>',
 bell:'<path d="M6.3 16.5v-5a5.7 5.7 0 0 1 11.4 0v5l1.4 1.5H4.9z"/><path d="M10 20.3a2 2 0 0 0 4 0"/>',
 party:'<path d="M5 19.5 9.2 7.8l7 7z"/><path d="M14.5 4.5c.3 1.3-.2 2.4-1.3 3M19.5 9.5c-1.3-.3-2.4.2-3 1.3M17.5 4.2v1.5M20 6.5h-1.5"/>'};
const ic=(n,s=22,w=1.8)=>`<svg class="ic" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[n]||''}</svg>`;

/* ---------- plan & photos ---------- */
const PH=__PH__;
const PLAN=__PLAN__;
const cp=o=>JSON.parse(JSON.stringify(o));
const photoSrc=k=>k?(S.photos?.[k]||PH[k]||''):'';
const T=(id,zone,x,y,w,h,shape,seats,join,n)=>({id,n:n||id,zone,x,y,w,h,shape,seats,join});
const DEF_SET={name:'Ваш ресторан',addr:'Актобе',open:'12:00',close:'02:00',dur:180,pin:'1234'};
function seed(){
 const d=bizToday(),mk=(table,joined,time,dur,guests,name,phone,status,source,comment='')=>({id:uid('b'),no:0,table,joined,date:d,time,dur,guests,name,phone,status,source,comment,created:Date.now()});
 const a=[mk('16',[],'17:30',180,4,'Мадина','+7 700 000 00 04','open','walkin'),mk('6',[],'18:30',180,2,'Данияр','+7 700 000 00 02','new','online'),
  mk('3',[],'19:00',180,4,'Айгерим','+7 700 000 00 01','wait','online'),mk('v1',[],'20:00',0,10,'Ерлан','+7 700 000 00 03','wait','host','торт свой'),
  mk('12',['11'],'20:30',150,4,'Олжас','+7 700 000 00 05','new','online'),mk('1',[],'13:00',120,3,'Жанна','+7 700 000 00 06','closed','online')];
 a.forEach((b,i)=>b.no=1201+i);a[3].occ='День рождения';a[2].occ='Свидание';return a;
}
const fresh=()=>({set:{...DEF_SET},zones:cp(PLAN.zones),tables:cp(PLAN.tables),decor:cp(PLAN.decor),bk:seed(),photos:{},seq:1210});
let S=null;try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
let LS=true;try{localStorage.setItem(KEY+'-t','1');localStorage.removeItem(KEY+'-t')}catch(e){LS=false}
function save(){if(!LS)return true;try{localStorage.setItem(KEY,JSON.stringify(S));return true}catch(e){toast('Память телефона заполнена — фото не сохранилось');return false}}

/* ---------- time ---------- */
const O=()=>m(S.set.open);
const C=()=>{const c=m(S.set.close);return c<=O()?c+1440:c};
const toAbs=t=>{const x=m(t);return x<O()&&C()>1440?x+1440:x};
const bs=b=>toAbs(b.time),be=b=>b.dur?bs(b)+b.dur:C();
const nowMin=()=>{const n=new Date();return n.getHours()*60+n.getMinutes()};
function bizToday(){const n=new Date(),x=n.getHours()*60+n.getMinutes(),set=S?S.set:DEF_SET,o=m(set.open),c=m(set.close);if(c<=o&&x<c){n.setDate(n.getDate()-1)}return ds(n)}
const nowAbs=()=>toAbs(hm(nowMin()));
function slots(step=30,tail=60){const o=[];for(let x=O();x<=C()-tail;x+=step)o.push(x);return o}
const slotOk=(date,x)=>date!==bizToday()||x>=nowAbs()+20;
const days=n=>Array.from({length:n},(_,i)=>{const d=pdate(bizToday());d.setDate(d.getDate()+i);return d});

if(!S||!S.tables||!S.set.close)S=fresh();S.photos=S.photos||{};save();

const tab=id=>S.tables.find(t=>t.id===id);
const zone=id=>S.zones.find(z=>z.id===id);
const zname=id=>zone(id)?.name||'';
function covering(id,date,s,e,excl){return S.bk.find(k=>ACT(k)&&k.id!==excl&&k.date===date&&(k.table===id||k.joined.includes(id))&&bs(k)<e&&s<be(k))}
function joinOrder(t){return t.join.map(tab).filter(o=>o&&o.zone===t.zone).sort((p,q)=>Math.hypot(p.x-t.x,p.y-t.y)-Math.hypot(q.x-t.x,q.y-t.y))}
const maxCap=t=>t.seats+joinOrder(t).reduce((s,o)=>s+o.seats,0);
function plan(t,date,s,e,g,excl){
 if(covering(t.id,date,s,e,excl))return{st:'bz'};
 if(g<=t.seats)return{st:'ok',joined:[]};
 let cap=t.seats;const used=[];
 for(const o of joinOrder(t)){if(covering(o.id,date,s,e,excl))break;cap+=o.seats;used.push(o.id);if(cap>=g)return{st:'mg',joined:used,cap}}
 return{st:'sm',max:cap};
}
const gS=()=>toAbs(ui.time),gE=()=>ui.dur?gS()+ui.dur:C();
const zoneFree=z=>S.tables.filter(t=>t.zone===z&&['ok','mg'].includes(plan(t,ui.date,gS(),gE(),ui.g).st)).length;
function tableAt(t,date,T){
 const L=S.bk.filter(b=>ACT(b)&&b.date===date&&(b.table===t.id||b.joined.includes(t.id))).sort((a,b)=>bs(a)-bs(b));
 const cur=L.find(b=>bs(b)<=T&&T<be(b));
 if(cur)return cur.status==='open'?{k:'busy',txt:`Занят до ${hm(be(cur))}`,b:cur}:{k:'res',txt:`Бронь до ${hm(be(cur))}`,sub:`${esc(cur.name)}, с ${cur.time}`,b:cur};
 const nx=L.find(b=>bs(b)>T);
 if(nx)return{k:'free',txt:`Свободен до ${nx.time}`,sub:`Бронь с ${nx.time} до ${hm(be(nx))}`,next:nx};
 return{k:'free',txt:'Свободен'};
}

let H='';try{H=location.hash}catch(e){}
const ui={mode:['#admin','#host','#editor'].includes(H)?'admin':'guest',step:1,date:bizToday(),time:'19:00',dur:S.set.dur,g:2,zone:S.zones[0].id,sel:null,selJ:[],via:false,done:null,
 form:{name:'',phone:'',comment:'',occ:'',cm:false},err:'',authed:false,atab:H==='#editor'?'edit':'tables',adate:bizToday(),T:null,tview:'cards',tzone:'all',tsort:'num',
 bseg:'act',bf:null,bday:null,calFor:'guest',banq:false,q:'',esel:null,zoom:1,json:'',nb:null,tmp:null};

function timeline(b,wide){
 const o=O(),c=C(),sp=c-o,p=x=>clamp((x-o)/sp*100,0,100),s=bs(b),e=be(b);
 const step=sp/60>10?2:1;let lb='';for(let h=Math.ceil(o/60);h*60<=c;h+=step)lb+=`<span class="lb" style="left:${p(h*60)}%">${pd(h%24)}</span>`;
 const now=b.date===bizToday()&&nowAbs()>=o&&nowAbs()<=c?`<i class="nw" style="left:${p(nowAbs())}%"></i>`:'';
 const mid=(p(s)+p(e))/2;
 return `<div class="tl ${wide?'wl':''}"><span class="tm" style="left:${clamp(mid,14,86)}%">${b.time} – ${hm(e)}</span><i class="tr"></i><i class="sg ${b.status}" style="left:${p(s)}%;width:${Math.max(1.5,p(e)-p(s))}%"></i>${now}${lb}</div>`;
}

function decorSVG(d,edit){
 const k=DT[d.t]||DT.dark;let sh='';
 if(k.el)sh=`<ellipse rx="${d.w/2}" ry="${d.h/2}" class="${k.c}"/>`;
 else if(k.ci)sh=`<circle r="${d.w/2}" class="${k.c}"/>`;
 else if(!k.tx)sh=`<rect x="${-d.w/2}" y="${-d.h/2}" width="${d.w}" height="${d.h}" rx="${Math.min(k.rx+2,d.w/2,d.h/2)}" class="${k.c}"/>`;
 const rot=k.tx?(d.rot||0):(d.h>d.w*1.3?-90:0);
 const txt=d.label?`<text text-anchor="middle" dominant-baseline="middle" class="${k.tx?'dl':k.tc||'dl'}" ${rot?`transform="rotate(${rot})"`:''}>${esc(d.label)}</text>`:'';
 let extra='';
 if(edit){const[w,h]=k.tx?textBox(d):[Math.max(d.w,16),Math.max(d.h,16)];

 return `<g class="dec ${edit?'drag':''}" data-k="d" data-id="${d.id}" transform="translate(${d.x},${d.y})">${sh}${extra}${txt}</g>`;

function seatDots(t){
 const n=t.seats,o=[];
 if(t.shape==='round'){const r=t.w/2+9;for(let i=0;i<n;i++){const a=(n===2?(t.sa==='v'?-Math.PI/2:0):-Math.PI/2)+i*2*Math.PI/n;o.push([r*Math.cos(a),r*Math.sin(a)])}}
 else{const a=Math.ceil(n/2),b=n-a,hz=t.w>=t.h,L=hz?t.w:t.h,E=(hz?t.h:t.w)/2+9;
  for(let i=0;i<a;i++){const p=-L/2+L*(i+.5)/a;o.push(hz?[p,-E]:[-E,p])}
  for(let i=0;i<b;i++){const p=-L/2+L*(i+.5)/b;o.push(hz?[p,E]:[E,p])}}
 return o.map(([x,y])=>`<circle class="seat" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="5"/>`).join('');
}

function clockSheet(){

 const cur=toAbs(ui.time);ui.wh={valid,hours,mins,h:Math.floor(cur/60),mi:cur%60};
 if(!hours.includes(ui.wh.h)){ui.wh.h=hours[0];ui.wh.mi=valid[0]%60}
 const col=(id,arr,f)=>`<div class="wheel" id="${id}"><div class="wsp"></div>${arr.map((v,i)=>`<div class="wi" data-act="wi" data-w="${id}" data-i="${i}">${f(v)}</div>`).join('')}<div class="wsp"></div></div>`;

 <div class="wheels"><i class="band"></i>${col('wh-h',hours,h=>pd(h%24))}<span class="colon">:</span>${col('wh-m',mins,pd)}</div>

 <div class="sec"><button class="btn" data-act="clock-ok">Готово</button></div>`);
 const H=$('#wh-h'),M=$('#wh-m');
 H.scrollTop=hours.indexOf(ui.wh.h)*WH;M.scrollTop=mins.indexOf(ui.wh.mi)*WH;
 let tm;const onS=()=>{clearTimeout(tm);tm=setTimeout(wheelSync,90)};H.addEventListener('scroll',onS,{passive:true});M.addEventListener('scroll',onS,{passive:true});wheelSync(true);

function wheelSync(first){
 const w=ui.wh,H=$('#wh-h'),M=$('#wh-m');if(!H||!M)return;
 w.h=w.hours[clamp(Math.round(H.scrollTop/WH),0,w.hours.length-1)];w.mi=w.mins[clamp(Math.round(M.scrollTop/WH),0,3)];
 M.querySelectorAll('.wi').forEach((el,i)=>el.classList.toggle('off',!w.valid.includes(w.h*60+w.mins[i])));
 if(!w.valid.includes(w.h*60+w.mi)){const ok=w.mins.filter(x=>w.valid.includes(w.h*60+x));const nm=ok.reduce((a,b)=>Math.abs(b-w.mi)<Math.abs(a-w.mi)?b:a,ok[0]);w.mi=nm;M.scrollTo({top:w.mins.indexOf(nm)*WH,behavior:first?'auto':'smooth'})}
 H.querySelectorAll('.wi').forEach((el,i)=>el.classList.toggle('on',w.hours[i]===w.h));M.querySelectorAll('.wi').forEach((el,i)=>el.classList.toggle('on',w.mins[i]===w.mi));
 const t=w.h*60+w.mi;$('#wtime').textContent=hm(t);$('#wnote').textContent=`стол будет за вами до ${hm(t+S.set.dur<=C()?t+S.set.dur:C())}`;
}

/* ---------- smooth DOM update (без мерцания) ---------- */
function morph(a,b){
 if(a.nodeType!==b.nodeType||a.nodeName!==b.nodeName){a.replaceWith(b);return}
 if(a.nodeType!==1){if(a.nodeValue!==b.nodeValue)a.nodeValue=b.nodeValue;return}
 for(const at of [...a.attributes])if(!b.hasAttribute(at.name))a.removeAttribute(at.name);
 for(const at of [...b.attributes])if(a.getAttribute(at.name)!==at.value)a.setAttribute(at.name,at.value);
 morphChildren(a,b);
 const tag=a.nodeName;if((tag==='INPUT'||tag==='TEXTAREA')&&a!==document.activeElement&&a.type!=='file'&&a.value!==b.value)a.value=b.value;
 if(tag==='SELECT'){const o=b.querySelector('option[selected]');if(o&&a.value!==o.value)a.value=o.value}
}
function morphChildren(a,b){
 const keyed=new Map();for(const c of a.children){const k=c.getAttribute('data-id');if(k)keyed.set(k,c)}
 const bc=[...b.childNodes];let i=0;
 for(const nb of bc){const cur=a.childNodes[i],k=nb.nodeType===1&&nb.getAttribute('data-id');
  if(k&&keyed.has(k)){const old=keyed.get(k);keyed.delete(k);if(old!==cur)a.insertBefore(old,cur||null);morph(old,nb)}
  else if(cur){const ck=cur.nodeType===1&&cur.getAttribute('data-id');if(ck)keyed.delete(ck);morph(cur,nb)}
  else a.appendChild(nb);
  i++}
 while(a.childNodes.length>i)a.lastChild.remove();
}
function morphInto(el,html){const t=document.createElement('template');t.innerHTML=html;morphChildren(el,t.content)}

  case 'nb-open':{const t=id?tab(id):null;ui.nb={date:ui.atab==='list'?(ui.bday||bizToday()):ui.adate,time:hm(ui.atab==='tables'?ui.T:clamp(Math.ceil(nowAbs()/15)*15,O(),C()-30)),dur:S.set.dur,g:t?Math.min(t.seats,4):2,table:t?t.id:null,name:'',phone:'',comment:''};
   if(ui.nb.date!==bizToday()&&ui.atab!=='tables')ui.nb.time='19:00';if(toAbs(ui.nb.time)+ui.nb.dur>C())ui.nb.dur=0;nbSheet();break}
  case 'nb-g':ui.nb.g=clamp(ui.nb.g+(+v),1,60);nbSheet();break;
  case 'nb-dur':ui.nb.dur=+v;nbSheet();break;
  case 'nb-t':ui.nb.table=v;nbSheet();break;
  case 'nb-save':{const n=ui.nb;if(!n.table){n.err='Выберите стол';return nbSheet()}if(n.name.trim().length<2){n.err='Напишите имя гостя';return nbSheet()}if(phoneDigits(n.phone)&&phoneErr(n.phone)){n.err=phoneErr(n.phone);return nbSheet()}
   const t=tab(n.table),s=toAbs(n.time),p=plan(t,n.date,s,n.dur?s+n.dur:C(),n.g);if(!['ok','mg'].includes(p.st)){n.err='Стол уже занят';return nbSheet()}
   const b={id:uid('b'),no:nextNo(),table:t.id,joined:p.joined,date:n.date,time:n.time,dur:n.dur,guests:n.g,name:n.name.trim(),phone:phoneDigits(n.phone)?n.phone.trim():'',comment:n.comment.trim(),status:'wait',source:'host',created:Date.now()};
   S.bk.push(b);closeSheet();ui.adate=b.date;if(ui.bday)ui.bday=b.date;commit();toast(`Бронь №${b.no} создана`);break}
  case 'walkin':{const t=tab(id),T=ui.T,st=tableAt(t,ui.adate,T);if(st.k!=='free')return toast('Стол занят');
   let d=Math.min(S.set.dur,C()-T);if(st.next)d=Math.min(d,bs(st.next)-T);
   const b={id:uid('b'),no:nextNo(),table:t.id,joined:[],date:ui.adate,time:hm(T),dur:d,guests:t.seats,name:'Гости без брони',phone:'',comment:'',status:'open',source:'walkin',created:Date.now()};
   S.bk.push(b);commit();bookingSheet(b);toast(st.next?`Посадили. Стол свободен до ${st.next.time}`:'Посадили гостей');break}
  case 'props':propsSheet(tab(id));break;
  case 'props-save':{const t=tab(id);t.desc=$('#p-desc').value.trim();t.deposit=Math.max(0,parseInt($('#p-dep').value,10)||0);closeSheet();commit();toast('Сохранено');break}
  case 'photo-del':{const t=tab(id);if(t.photo&&S.photos[t.photo])delete S.photos[t.photo];t.photo='';save();propsSheet(t);render();break}
  /* editor */
  case 'sel-close':ui.esel=null;render();break;
  case 'add':openSheet(`${shead('Добавить на схему','Появится в середине экрана — потом перетащите на место')}<div class="pal">${PAL.map((p,i)=>`<button data-act="add-item" data-v="${i}">${palIcon(p[1],p[2])}${p[0]}</button>`).join('')}</div>`);break;
  case 'add-item':{const[,k,o]=PAL[+v],[x,y]=viewCenter();snap();
   if(k==='t'){const t={id:uid('t'),n:nextNum(),zone:ui.zone,x,y,w:o.w,h:o.h,shape:o.shape,seats:o.seats,join:[]};S.tables.push(t);ui.esel={k:'t',id:t.id}}
   else{const d={id:uid('d'),z:ui.zone,x,y,label:'',rot:0,...o};S.decor.push(d);ui.esel={k:'d',id:d.id}}
   closeSheet();commit();break}
  case 'undo':{const p=undo.pop();if(!p)return;const o=JSON.parse(p);S.zones=o.z;S.tables=o.t;S.decor=o.d;if(!zone(ui.zone))ui.zone=S.zones[0].id;if(!curItem())ui.esel=null;commit();toast('Отменено');break}
  case 'zoom':ui.zoom=clamp(ui.zoom+ +v,1,3);render();break;
  case 'p-seat':if(!it)return;snap();it.seats=clamp(it.seats+(+v.split(':')[1]),1,40);commit();break;
  case 'p-shape':if(!it)return;snap();it.shape=v;if(v==='round'){const s=Math.max(20,Math.min(it.w,it.h));it.w=it.h=s}commit();break;
  case 'p-size':{if(!it)return;const[k,dir]=v.split(':'),step=(it[k]>=100?10:it[k]>=30?5:2)*(+dir),mn=isT?20:4;snap();
   const round=isT?it.shape==='round':it.t==='stool';
   if(round){it.w=it.h=clamp(it.w+step,mn,400)}else it[k]=clamp(it[k]+step,mn,600);commit();break}
  case 'mv':{if(!it)return;const[dx,dy]=v.split(',').map(Number),z=zone(isT?it.zone:it.z);snap();it.x=clamp(it.x+dx,0,360);it.y=clamp(it.y+dy,0,z.h);commit();break}
  case 'rot':if(!it)return;snap();if(!isT&&it.t==='text')it.rot=it.rot?0:-90;else{[it.w,it.h]=[it.h,it.w];if(isT&&it.sa)it.sa=it.sa==='v'?'h':'v'}commit();break;
  case 'dup':{if(!it)return;snap();const c=JSON.parse(JSON.stringify(it));c.x=clamp(c.x+20,0,360);c.y+=20;
   if(isT){c.id=uid('t');c.n=nextNum();c.join=[];S.tables.push(c);ui.esel={k:'t',id:c.id}}else{c.id=uid('d');S.decor.push(c);ui.esel={k:'d',id:c.id}}commit();break}
  case 'back':if(!it||isT)return;snap();S.decor=[it,...S.decor.filter(d=>d!==it)];commit();break;
  case 'del':if(!it)return;if(!twice(el,'Ещё раз'))return;snap();
   if(isT){S.tables=S.tables.filter(t=>t!==it);S.tables.forEach(t=>t.join=t.join.filter(x=>x!==it.id))}else S.decor=S.decor.filter(d=>d!==it);
   ui.esel=null;commit();toast('Удалено');break;
  case 'p-join':{if(!it)return;snap();const o=tab(id),on=it.join.includes(id);
   it.join=on?it.join.filter(x=>x!==id):[...it.join,id];o.join=on?o.join.filter(x=>x!==it.id):[...new Set([...o.join,it.id])];commit();break}
  case 'z-add':{snap();const z={id:uid('z'),name:'Новая зона',h:400};S.zones.push(z);ui.zone=z.id;ui.esel=null;commit();toast('Зона добавлена — переименуйте её ниже');break}
  case 'z-h':{const z=zone(ui.zone);snap();z.h=clamp(z.h+(+v),200,2000);commit();break}
  case 'z-del':{if(S.zones.length<2)return toast('Нужна хотя бы одна зона');if(!twice(el,'Удалить со всеми столами?'))return;snap();
   const zid=ui.zone,gone=S.tables.filter(t=>t.zone===zid).map(t=>t.id);S.zones=S.zones.filter(z=>z.id!==zid);S.tables=S.tables.filter(t=>t.zone!==zid);
   S.tables.forEach(t=>t.join=t.join.filter(x=>!gone.includes(x)));S.decor=S.decor.filter(d=>d.z!==zid);ui.zone=S.zones[0].id;ui.esel=null;commit();break}
  case 'copy-json':{const j=planJSON();ui.json='out';render();const ta=$('#j-out');if(ta){ta.focus();ta.select()}
   if(navigator.clipboard)navigator.clipboard.writeText(j).then(()=>toast('Схема скопирована'),()=>toast('Выделите текст ниже и скопируйте вручную'));else toast('Выделите текст ниже и скопируйте вручную');break}
  case 'show-in':ui.json=ui.json==='in'?'':'in';render();break;
  case 'load-json':{try{const o=JSON.parse($('#j-in').value);
    if(!Array.isArray(o.zones)||!o.zones.length||!Array.isArray(o.tables)||!Array.isArray(o.decor))throw 0;
    snap();S.zones=o.zones;S.tables=o.tables.map(t=>({join:[],...t}));S.decor=o.decor;ui.zone=S.zones[0].id;ui.esel=null;ui.json='';commit();toast('Схема загружена')}
   catch(err){toast('Не получилось прочитать схему — скопирован ли весь текст?')}break}
  case 'reset-plan':if(!twice(el,'Нажмите ещё раз'))return;snap();S.zones=cp(PLAN.zones);S.tables=cp(PLAN.tables);S.decor=cp(PLAN.decor);ui.zone=S.zones[0].id;ui.esel=null;commit();toast('Схема сброшена');break;
  case 'save-set':{const pin=$('#s-pin').value.trim(),o=$('#s-open').value,c=$('#s-close').value;
   if(pin.length<4){ui.err='PIN — минимум 4 цифры';return render()}
   if(!o||!c||o===c){ui.err='Проверьте часы работы';return render()}
   Object.assign(S.set,{name:$('#s-name').value.trim()||'Ресторан',addr:$('#s-addr').value.trim(),open:o,close:c,dur:+$('#s-dur').value,pin});ui.err='';save();pickTime();pickT();render();toast('Сохранено');break}
  case 'reset-all':if(!twice(el,'Нажмите ещё раз — всё сбросится'))return;S=fresh();undo=[];save();ui.atab='tables';ui.zone=S.zones[0].id;pickT();render();toast('Сброшено');break;
  case 'close':closeSheet();break;
  case 'close-bg':if(e.target===el)closeSheet();break;
 }
});
document.addEventListener('change',e=>{
 const id=e.target.id;
 if(id==='p-label'){const it=curItem();if(!it)return;const v=e.target.value.trim();snap();if(ui.esel.k==='t'){if(v)it.n=v}else it.label=v;commit()}
 if(id==='z-name'){const z=zone(ui.zone),v=e.target.value.trim();if(v){snap();z.name=v;commit()}}
 if(id==='nb-time'){ui.nb.time=e.target.value;if(ui.nb.dur&&toAbs(ui.nb.time)+ui.nb.dur>C())ui.nb.dur=0;nbSheet()}
 if(id==='p-photo'){const f=e.target.files[0],t=tab(e.target.dataset.id);if(!f||!t)return;resizeImg(f,url=>{const k=uid('ph');const old=t.photo;S.photos[k]=url;t.photo=k;if(!save()){delete S.photos[k];t.photo=old;return}if(old&&S.photos[old])delete S.photos[old];save();propsSheet(t);render();toast('Фото сохранено')})}
});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches?.('.tbl[data-act]')){e.preventDefault();e.target.dispatchEvent(new MouseEvent('click',{bubbles:true}))}
 if(e.key==='Enter'&&e.target.id==='pin')$('[data-act="pin"]').click();
 if(e.key==='Enter'&&e.target.id==='p-label')e.target.blur()});
document.addEventListener('input',e=>{
 if(e.target.classList?.contains('phone')){const el=e.target,f=fmtPhone(el.value);if(el.value!==f){el.value=f;try{el.setSelectionRange(f.length,f.length)}catch(_){}}}
 const k={'f-name':'name','f-phone':'phone','f-comment':'comment'}[e.target.id];if(k)ui.form[k]=e.target.value;
 const nk={'nb-name':'name','nb-phone':'phone','nb-comment':'comment'}[e.target.id];if(nk&&ui.nb)ui.nb[nk]=e.target.value;
 if(e.target.id==='trange'){ui.T=+e.target.value;$('#tval').textContent='с '+hm(ui.T);morphInto($('#tlist'),tablesBody())}
 if(e.target.id==='q'){ui.q=e.target.value;const L=document.createElement('div');L.innerHTML=hostList();morphInto($('#blist'),L.querySelector('#blist').innerHTML)}
});
document.addEventListener('focusin',e=>{if(e.target.classList?.contains('phone')){const el=e.target;if(!el.value)el.value='+7 ';setTimeout(()=>{try{el.setSelectionRange(el.value.length,el.value.length)}catch(_){}},0)}});
document.addEventListener('keydown',e=>{const el=e.target;if(el.classList?.contains('phone')&&e.key==='Backspace'&&el.value.replace(/\D/g,'').length<=1){e.preventDefault()}});
window.addEventListener('hashchange',()=>{const md=['#admin','#host','#editor'].includes(location.hash)?'admin':'guest';if(md!==ui.mode){ui.mode=md;render()}});

let drag=null,bgTap=null;
function bindDrag(){
 if(!(ui.mode==='admin'&&ui.authed&&ui.atab==='edit'))return;
 const svg=$('#mapsvg');if(!svg||svg._bound)return;svg._bound=true;const EDIT=()=>ui.mode==='admin'&&ui.atab==='edit';
 const pt=e=>{const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform(svg.getScreenCTM().inverse())};
 svg.addEventListener('touchstart',e=>{if(EDIT()&&e.target.closest('.drag'))e.preventDefault()},{passive:false});
 svg.addEventListener('pointerdown',e=>{
  if(!EDIT())return;const g=e.target.closest('.drag');
  if(!g){bgTap={x:e.clientX,y:e.clientY};return}
  const k=g.dataset.k,item=k==='t'?tab(g.dataset.id):S.decor.find(d=>d.id===g.dataset.id);if(!item)return;
  const p=pt(e);drag={k,item,g,dx:p.x-item.x,dy:p.y-item.y,sx:p.x,sy:p.y,moved:false};
  try{svg.setPointerCapture(e.pointerId)}catch(_){}e.preventDefault()});
 svg.addEventListener('pointermove',e=>{if(!drag)return;const p=pt(e);
  if(!drag.moved){if(Math.hypot(p.x-drag.sx,p.y-drag.sy)<4)return;drag.moved=true;snap()}
  const z=zone(ui.zone),r5=v=>Math.round(v/5)*5;drag.item.x=clamp(r5(p.x-drag.dx),0,360);drag.item.y=clamp(r5(p.y-drag.dy),0,z.h);
  drag.g.setAttribute('transform',`translate(${drag.item.x},${drag.item.y})`)});
 svg.addEventListener('pointerup',e=>{
  if(drag){const d=drag;drag=null;ui.esel={k:d.k,id:d.item.id};if(d.moved)save();render();return}
  if(bgTap&&Math.hypot(e.clientX-bgTap.x,e.clientY-bgTap.y)<6&&ui.esel){ui.esel=null;render()}bgTap=null});
 svg.addEventListener('pointercancel',()=>{if(drag?.moved)save();drag=null;bgTap=null});
}
render();
}
</script>
</body>
